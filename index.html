<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoMojo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app-container"></div>
    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // Получение параметра page из URL
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page') || 'timezone';
        
        // API base: dev tunnel or production
        const API_BASE = window.location.hostname.includes('dev')
            ? 'https://dev-api.lingomojo.com'
            : 'https://api.lingomojo.com';

        // Static pages only — grammar is served dynamically via API
        const staticPages = {
            'timezone':    'pages/timezone.html',
            'agreement':   'pages/agreement.html',
            'help':        'pages/help.html',
            'c4':          'pages/C4.html',
            'wordselector':'pages/wordselector.html',
            'progress':    'pages/progress.html',
        };

        function showError(msg) {
            document.getElementById('app-container').innerHTML = `
                <div style="padding: 20px; text-align: center;">
                    <h2>Ошибка загрузки</h2>
                    <p>${msg}</p>
                </div>
            `;
        }

        // Загрузка соответствующей страницы
        async function loadPage(pageName) {
            let pageUrl;

            if (pageName.startsWith('gram_')) {
                pageUrl = `${API_BASE}/grammar/${pageName}`;
            } else {
                pageUrl = staticPages[pageName];
                if (!pageUrl) {
                    showError(`Страница "${pageName}" не существует`);
                    return;
                }
            }

            try {
                const response = await fetch(pageUrl);
                if (!response.ok) {
                    showError(`Не удалось загрузить страницу (${response.status})`);
                    return;
                }
                const html = await response.text();
                document.getElementById('app-container').innerHTML = html;

                // Для всех грамматических страниц — один общий скрипт
                const scriptName = pageName.startsWith('gram_') ? 'grammar' : pageName;

                const script = document.createElement('script');
                script.src = `js/${scriptName}.js`;
                script.onload = function() {
                    console.log(`Script ${scriptName}.js loaded`);
                };
                script.onerror = function() {
                    console.warn(`Script js/${scriptName}.js not found or failed to load`);
                };
                document.body.appendChild(script);

            } catch (error) {
                console.error('Error loading page:', error);
                showError('Не удалось загрузить страницу');
            }
        }
        
        // Загрузка страницы при старте
        loadPage(page);
    </script>
</body>
</html>
