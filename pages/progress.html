<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Progress</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            padding: 20px 16px 32px;
        }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 20px; text-align: center; }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 12px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; opacity: 0.5; margin-bottom: 6px;
        }
        .card-value { font-size: 36px; font-weight: 700; line-height: 1; }
        .card-sub { font-size: 13px; opacity: 0.6; margin-top: 4px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    </style>
</head>
<body>
    <div id="progress-root"></div>
</body>
</html>
