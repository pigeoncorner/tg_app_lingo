<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогресс</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            padding: 20px 16px 32px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            margin-bottom: 6px;
        }

        .card-value {
            font-size: 36px;
            font-weight: 700;
            line-height: 1;
        }

        .card-sub {
            font-size: 13px;
            opacity: 0.6;
            margin-top: 4px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            opacity: 0.5;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #e53935;
        }
    </style>
</head>
<body>
    <div id="content" class="loading">Загрузка...</div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.ready(); tg.expand(); }

        const API_BASE = (window.location.hostname || '').includes('dev')
            ? 'https://dev-api.lingomojo.com'
            : 'https://api.lingomojo.com';

        const userId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user
            ? tg.initDataUnsafe.user.id
            : null;

        async function loadProgress() {
            const el = document.getElementById('content');
            if (!userId) {
                el.className = 'error';
                el.textContent = 'Не удалось определить пользователя';
                return;
            }
            try {
                const resp = await fetch(`${API_BASE}/api/progress?user_id=${userId}`);
                if (!resp.ok) throw new Error(resp.status);
                const d = await resp.json();
                render(d);
            } catch (e) {
                el.className = 'error';
                el.textContent = 'Не удалось загрузить данные';
            }
        }

        function render(d) {
            const streakEmoji = d.streak_current >= 7 ? '🔥' : (d.streak_current > 0 ? '⚡' : '💤');
            document.getElementById('content').innerHTML = `
                <h1>📊 Мой прогресс</h1>

                <div class="card">
                    <div class="card-title">Серия дней</div>
                    <div class="card-value">${streakEmoji} ${d.streak_current}</div>
                    <div class="card-sub">Рекорд: ${d.streak_longest} ${plural(d.streak_longest, 'день', 'дня', 'дней')}</div>
                </div>

                <div class="row">
                    <div class="card">
                        <div class="card-title">XP</div>
                        <div class="card-value">⭐ ${d.xp}</div>
                        <div class="card-sub">очки опыта</div>
                    </div>
                    <div class="card">
                        <div class="card-title">Уровень</div>
                        <div class="card-value">${levelEmoji(d.level)}</div>
                        <div class="card-sub">${d.level_label}</div>
                    </div>
                </div>
            `;
        }

        function plural(n, one, few, many) {
            const mod10 = n % 10, mod100 = n % 100;
            if (mod10 === 1 && mod100 !== 11) return one;
            if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
            return many;
        }

        function levelEmoji(level) {
            return level === 1 ? '🔴 A' : level === 3 ? '🟢 C' : '🟡 B';
        }

        loadProgress();
    </script>
</body>
</html>
