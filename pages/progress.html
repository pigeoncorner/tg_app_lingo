<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Progress</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            padding: 20px 16px 32px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            margin-bottom: 6px;
        }

        .card-value {
            font-size: 36px;
            font-weight: 700;
            line-height: 1;
        }

        .card-sub {
            font-size: 13px;
            opacity: 0.6;
            margin-top: 4px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #e53935;
        }
    </style>
</head>
<body>
    <div id="content"></div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.ready(); tg.expand(); }

        const p = new URLSearchParams(window.location.search);
        const streak  = parseInt(p.get('streak') || '0', 10);
        const best    = parseInt(p.get('best')   || '0', 10);
        const xp      = parseInt(p.get('xp')     || '0', 10);
        const level   = parseInt(p.get('level')  || '2', 10);
        const levelLabel = (p.get('level_label') || 'B+(Intermediate)').replace(/\+/g, ' ');

        const streakEmoji = streak >= 7 ? '🔥' : streak > 0 ? '⚡' : '💤';

        document.getElementById('content').innerHTML = `
            <h1>📊 My Progress</h1>

            <div class="card">
                <div class="card-title">Streak</div>
                <div class="card-value">${streakEmoji} ${streak}</div>
                <div class="card-sub">Best: ${best} day${best !== 1 ? 's' : ''}</div>
            </div>

            <div class="row">
                <div class="card">
                    <div class="card-title">XP</div>
                    <div class="card-value">⭐ ${xp}</div>
                    <div class="card-sub">experience points</div>
                </div>
                <div class="card">
                    <div class="card-title">Level</div>
                    <div class="card-value">${levelEmoji(level)}</div>
                    <div class="card-sub">${levelLabel}</div>
                </div>
            </div>
        `;

        function levelEmoji(l) {
            return l === 1 ? '🔴 A' : l === 3 ? '🟢 C' : '🟡 B';
        }
    </script>
</body>
</html>
